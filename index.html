<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Verre Chantant v3.0 - Niveau d'Eau</title>
    
    <!-- ========================= SECTION CSS ========================= -->
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --water-color: rgba(0, 150, 255, 0.4);
            --bg-color: #f8f9fa;
            --card-bg-color: #ffffff;
            --text-color: #212529;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg-color);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        header {
            text-align: center;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        
        h1, h2 {
            margin: 0;
            padding: 0;
        }
        header h1 {
            color: var(--primary-color);
        }

        .setup-section {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .setup-section h2 {
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .preset-buttons, .water-level-options {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 0.6rem 1rem;
            border: 1px solid #ccc;
            border-radius: 20px;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .preset-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .water-level-options label {
            padding: 0.6rem 1rem;
            border: 1px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        input[type="radio"] { display: none; }
        input[type="radio"]:checked + label {
             background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .frequency-display {
            background-color: var(--bg-color);
            border-radius: 8px;
            text-align: center;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        #frequency-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            margin: 1rem 0;
        }

        .fine-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .fine-controls button {
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #ccc;
            background-color: var(--card-bg-color);
            cursor: pointer;
        }
        
        #start-stop-button {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: #28a745;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #start-stop-button.active { background-color: #dc3545; }

        .visualization {
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 1.5rem;
        }

        .glass { position: relative; }
        .glass.vibrating { animation: shake 0.2s infinite; }
        .glass > div { transition: opacity 0.3s; }
        .glass .hidden { display: none; }
        
        .glass-bowl { position: relative; overflow: hidden; }
        .glass-stem { width: 6px; height: 40px; background-color: var(--secondary-color); margin: 0 auto; }
        .glass-base { width: 50px; height: 6px; background-color: var(--secondary-color); border-radius: 3px; margin: 0 auto; }
        
        .wine-bowl { width: 80px; height: 70px; border: 4px solid var(--secondary-color); border-top: none; border-radius: 0 0 40px 40px; }
        .flute-bowl { width: 40px; height: 90px; border: 4px solid var(--secondary-color); border-top: none; border-radius: 0 0 15px 15px; }
        .water-bowl { width: 70px; height: 60px; border: 4px solid var(--secondary-color); border-top: none; border-radius: 0 0 10px 10px; }

        .water-level {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 0;
            background-color: var(--water-color);
            transition: height 0.3s ease-out;
        }
        .glass.has-water .water-level { height: 50%; }

        @keyframes shake {
            0% { transform: translate(1px, 0); }
            50% { transform: translate(-1px, 0); }
            100% { transform: translate(1px, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Le Verre Chantant 3.0</h1>
            <p>Observez la résonance sur la surface de l'eau !</p>
        </header>

        <section class="setup-section">
            <h2>1. Configuration du verre</h2>
            <div class="preset-buttons">
                <button class="preset-btn active" data-preset="wine">Vin</button>
                <button class="preset-btn" data-preset="flute">Flûte</button>
                <button class="preset-btn" data-preset="water">Eau</button>
            </div>
            <div class="water-level-options" style="margin-top: 1rem;">
                <input type="radio" id="level-empty" name="waterLevel" value="empty" checked>
                <label for="level-empty">Vide</label>
                
                <input type="radio" id="level-half" name="waterLevel" value="half">
                <label for="level-half">À moitié plein</label>
            </div>
        </section>

        <main class="control-panel">
            <h2>2. Recherche de la fréquence</h2>
            <div class="frequency-display">
                <span id="frequency-value">550</span> Hz
            </div>

            <input type="range" id="frequency-slider" min="300" max="1200" value="550" step="1">

            <div class="fine-controls">
                <button id="minus-button">-</button>
                <button id="plus-button">+</button>
            </div>

            <h2>3. Lancez le son</h2>
            <button id="start-stop-button">Démarrer</button>

            <div class="visualization">
                <div id="glass-visual" class="glass">
                    <div id="wine-visual">
                        <div class="wine-bowl glass-bowl"><div class="water-level"></div></div>
                        <div class="glass-stem"></div><div class="glass-base"></div>
                    </div>
                    <div id="flute-visual" class="hidden">
                        <div class="flute-bowl glass-bowl"><div class="water-level"></div></div>
                        <div class="glass-stem"></div><div class="glass-base"></div>
                    </div>
                    <div id="water-visual" class="hidden">
                        <div class="water-bowl glass-bowl"><div class="water-level"></div></div>
                        <div class="glass-stem"></div><div class="glass-base"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ======================= SECTION JAVASCRIPT ====================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('frequency-slider');
            const freqValueDisplay = document.getElementById('frequency-value');
            const startStopBtn = document.getElementById('start-stop-button');
            const plusBtn = document.getElementById('plus-button');
            const minusBtn = document.getElementById('minus-button');
            const glassVisual = document.getElementById('glass-visual');
            const presetBtns = document.querySelectorAll('.preset-btn');
            const waterLevelRadios = document.querySelectorAll('input[name="waterLevel"]');
            const glassVisuals = {
                wine: document.getElementById('wine-visual'),
                flute: document.getElementById('flute-visual'),
                water: document.getElementById('water-visual')
            };

            let audioContext, oscillator, gainNode, isPlaying = false;
            
            const PRESETS = {
                wine:  { empty: 550, half: 420 }, // Fréq. plus basse avec eau
                flute: { empty: 800, half: 600 },
                water: { empty: 450, half: 350 }
            };

            function updateFrequency(newFreq) {
                newFreq = Math.max(parseInt(slider.min), Math.min(parseInt(slider.max), newFreq));
                slider.value = newFreq;
                freqValueDisplay.textContent = newFreq;
                if (isPlaying && oscillator) {
                    oscillator.frequency.setTargetAtTime(newFreq, audioContext.currentTime, 0.01);
                }
            }

            function updateTarget() {
                // Trouver les sélections actives
                const activePresetBtn = document.querySelector('.preset-btn.active');
                const activeWaterRadio = document.querySelector('input[name="waterLevel"]:checked');
                
                const presetType = activePresetBtn.dataset.preset;
                const waterStatus = activeWaterRadio.value;

                // Mettre à jour la fréquence cible
                const targetFreq = PRESETS[presetType][waterStatus];
                updateFrequency(targetFreq);

                // Mettre à jour la visualisation du type de verre
                for (const type in glassVisuals) {
                    glassVisuals[type].classList.toggle('hidden', type !== presetType);
                }
                
                // Mettre à jour la visualisation du niveau d'eau
                glassVisual.classList.toggle('has-water', waterStatus === 'half');
            }

            // Écouteurs d'événements
            slider.addEventListener('input', () => updateFrequency(parseInt(slider.value)));
            plusBtn.addEventListener('click', () => updateFrequency(parseInt(slider.value) + 1));
            minusBtn.addEventListener('click', () => updateFrequency(parseInt(slider.value) - 1));
            
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    presetBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateTarget();
                });
            });

            waterLevelRadios.forEach(radio => {
                radio.addEventListener('change', updateTarget);
            });

            startStopBtn.addEventListener('click', () => {
                if (isPlaying) stopSound();
                else startSound();
            });

            function startSound() {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();

                oscillator = audioContext.createOscillator();
                gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.type = 'sine';
                oscillator.frequency.value = parseInt(slider.value);
                gainNode.gain.value = 0.8;

                oscillator.start();
                isPlaying = true;
                updateUI(true);
            }

            function stopSound() {
                if (oscillator) {
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.1);
                    oscillator.stop(audioContext.currentTime + 0.1);
                }
                isPlaying = false;
                updateUI(false);
            }

            function updateUI(playing) {
                startStopBtn.textContent = playing ? 'Arrêter' : 'Démarrer';
                startStopBtn.classList.toggle('active', playing);
                glassVisual.classList.toggle('vibrating', playing);
            }
            
            // Initialiser l'état au chargement
            updateTarget();
        });
    </script>
</body>
</html>
